<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NativeCode Terminal</title>
<link rel="stylesheet" href="xterm.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0d1117;
    overflow: hidden;
  }
  #terminal {
    width: 100%; height: 100%;
  }
  .xterm {
    padding: 8px;
    height: 100%;
  }
  .xterm-viewport {
    overflow-y: auto !important;
  }
  @font-face {
    font-family: 'JetBrainsMonoNF';
    src: url('fonts/JetBrainsMonoNF-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.min.js"></script>
<script>
// ── Terminal setup ──────────────────────────────────────────────────────────
const term = new Terminal({
  fontFamily: "'JetBrainsMonoNF', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace",
  fontSize: 12,
  lineHeight: 1.2,
  letterSpacing: 0,
  theme: {
    background:    '#0d1117',
    foreground:    '#e6edf3',
    cursor:        '#58a6ff',
    cursorAccent:  '#0d1117',
    black:         '#484f58',
    red:           '#ff7b72',
    green:         '#3fb950',
    yellow:        '#d29922',
    blue:          '#58a6ff',
    magenta:       '#bc8cff',
    cyan:          '#39c5cf',
    white:         '#b1bac4',
    brightBlack:   '#6e7681',
    brightRed:     '#ffa198',
    brightGreen:   '#56d364',
    brightYellow:  '#e3b341',
    brightBlue:    '#79c0ff',
    brightMagenta: '#d2a8ff',
    brightCyan:    '#56d4dd',
    brightWhite:   '#f0f6fc',
    selectionBackground: '#264f78',
  },
  cursorBlink: true,
  cursorStyle: 'block',
  scrollback: 10000,
  convertEol: true,
  allowProposedApi: true,
  rendererType: 'canvas',
});

term.open(document.getElementById('terminal'));
term.focus();

// ── Bridge: terminal input → Kotlin ────────────────────────────────────────
term.onData(function(data) {
  // Pass every keypress/paste to the Kotlin shell session
  Android.onTerminalInput(data);
});

// ── Bridge: Kotlin output → terminal (Base64 decoded for safety) ───────────
const decoder = new TextDecoder('utf-8');
function writeBase64(b64) {
  try {
    const binaryString = window.atob(b64);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    term.write(decoder.decode(bytes));
  } catch (e) {
    console.error('Base64 decode failed', e);
  }
}

// ── Resize handling ─────────────────────────────────────────────────────────
function fitTerminal() {
  const core = term._core;
  if (!core) return;
  const dims = core._renderService.dimensions;
  if (!dims) return;
  const cols = Math.floor(document.getElementById('terminal').clientWidth  / dims.css.cell.width);
  const rows = Math.floor(document.getElementById('terminal').clientHeight / dims.css.cell.height);
  if (cols > 0 && rows > 0 && (cols !== term.cols || rows !== term.rows)) {
    term.resize(cols, rows);
    Android.onResize(cols, rows);
  }
}

window.addEventListener('resize', fitTerminal);
// Fit after font loads
document.fonts.ready.then(function() {
  setTimeout(fitTerminal, 100);
});

function clearTerminal() {
  term.clear();
}

function scrollToBottom() {
  term.scrollToBottom();
}
</script>
</body>
</html>
